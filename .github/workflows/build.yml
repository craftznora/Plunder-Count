name: Build PlunderCount.exe
on:
  push:
    branches: ['**', '!previews']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/PlunderCount/PlunderCount.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: PlunderCount
          path: dist/PlunderCount.exe
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PlunderCount.exe
          body_path: RELEASE_NOTES.md
      - name: Render previews (overlay + report) to the previews branch
        timeout-minutes: 8
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = Join-Path $pwd 'previews'
          $data = Join-Path $pwd 'demo-data'
          New-Item -ItemType Directory -Force $out, $data | Out-Null
          $p = Start-Process -FilePath (Resolve-Path dist\PlunderCount.exe) -ArgumentList @('--demo', '--data', $data, '--overlay-preview', (Join-Path $out 'overlay.png')) -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          foreach ($page in @(@('report.html', 'report.png', '1400,3200'), @('overlay.html', 'obs.png', '460,300'), @('stream.html', 'stream.png', '520,200'))) {
            $src = Join-Path $out $page[0]
            if (Test-Path $src) {
              $url = 'file:///' + ($src -replace '\\', '/')
              $e = Start-Process -FilePath $edge -ArgumentList @('--headless=new', '--disable-gpu', '--hide-scrollbars', '--force-device-scale-factor=1', "--window-size=$($page[2])", "--screenshot=$(Join-Path $out $page[1])", '--virtual-time-budget=4000', $url) -PassThru
              if (-not $e.WaitForExit(60000)) { $e.Kill() }
            }
          }
          Get-ChildItem $out | Format-Table Name, Length
          Set-Location $out
          git init -q
          git checkout -q -b previews
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "previews $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:$env:TOKEN@github.com/$env:GITHUB_REPOSITORY.git" previews
